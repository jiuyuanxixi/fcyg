<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方城一高 · 校园墙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d0f14;
    --panel: #14171f;
    --panel-2: #1a1e28;
    --border: #232833;
    --text: #e6e9ef;
    --text-2: #8b93a7;
    --text-3: #5a6274;
    --accent: #5b7cfa;
    --accent-2: #7c5bfa;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* 顶栏 */
  .topbar {
    height: 56px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    position: sticky;
    top: 0;
    background: rgba(13,15,20,.92);
    backdrop-filter: blur(8px);
    z-index: 50;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
  }

  .logo-icon {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: linear-gradient(135deg, #5b7cfa, #7c5bfa);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }

  .search {
    flex: 1;
    max-width: 520px;
    height: 36px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 14px;
    color: var(--text-2);
    font-size: 13px;
    display: flex; align-items: center;
    outline: none;
  }

  .search:focus-within { border-color: var(--accent); }
  .search input {
    background: none; border: none; outline: none;
    color: var(--text); font-size: 13px; width: 100%;
    font-family: inherit;
  }
  .search input::placeholder { color: var(--text-3); }

  .top-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn {
    height: 34px;
    padding: 0 16px;
    border-radius: 7px;
    border: none;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: opacity .15s;
    white-space: nowrap;
  }
  .btn:hover { opacity: .85; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    font-weight: 500;
  }

  .btn-ghost {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
  }

  /* 布局 */
  .layout {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    display: grid;
    grid-template-columns: 200px 1fr 240px;
    gap: 20px;
    align-items: start;
  }

  /* 左侧栏 */
  .side {
    position: sticky;
    top: 80px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .menu {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 7px;
    color: var(--text-2);
    font-size: 13.5px;
    cursor: pointer;
    transition: all .12s;
  }

  .menu-item:hover { background: var(--panel); color: var(--text); }

  .menu-item.active {
    background: var(--panel-2);
    color: var(--text);
    font-weight: 500;
    position: relative;
  }

  .menu-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 16px;
    background: var(--accent);
    border-radius: 0 3px 3px 0;
  }

  .menu-icon { width: 16px; text-align: center; opacity: .9; }

  .publish {
    width: 100%;
    height: 40px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .publish:hover { opacity: .9; }

  .rules {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-size: 12px;
    color: var(--text-3);
    line-height: 1.8;
  }

  .rules-title { color: var(--text-2); margin-bottom: 6px; font-size: 12.5px; }

  /* 中间主区 */
  .main { min-width: 0; }

  .hero {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }

  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-2);
    margin-bottom: 14px;
  }

  .dot { width: 6px; height: 6px; border-radius: 50%; background: #3fb950; }

  .hero h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: .5px;
  }

  .hero h1 em {
    font-style: normal;
    background: linear-gradient(135deg, #5b7cfa, #9b7cfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero p {
    color: var(--text-2);
    font-size: 13.5px;
    line-height: 1.8;
    margin-bottom: 18px;
    max-width: 520px;
  }

  .stats {
    display: flex;
    gap: 36px;
    margin-bottom: 20px;
  }

  .stat-num { font-size: 22px; font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  .hero-actions { display: flex; gap: 10px; }

  /* 发帖框 */
  .composer {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
    display: none;
  }

  .composer.show { display: block; }

  .composer textarea {
    width: 100%;
    min-height: 80px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    outline: none;
    line-height: 1.7;
  }

  .composer textarea:focus { border-color: var(--accent); }

  .composer-bar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 10px;
  }

  /* 筛选 */
  .filters {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 14px;
  }

  .filter {
    padding: 6px 14px;
    border-radius: 7px;
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
    transition: all .12s;
  }
  .filter:hover { color: var(--text); }
  .filter.active { background: var(--panel-2); color: var(--text); font-weight: 500; }

  .refresh {
    margin-left: auto;
    font-size: 12.5px;
    color: var(--text-3);
    cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    padding: 6px 10px;
    border-radius: 6px;
  }
  .refresh:hover { color: var(--text-2); background: var(--panel); }

  /* 帖子 */
  .post {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
    transition: border-color .15s;
  }

  .post:hover { border-color: #2e3542; }

  .post-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5b7cfa, #7c5bfa);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .post-user { font-size: 13.5px; font-weight: 500; }
  .post-meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  .pin {
    margin-left: auto;
    font-size: 11px;
    background: #2d1f3a;
    color: #c99bff;
    padding: 3px 8px;
    border-radius: 5px;
  }

  .post-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
    line-height: 1.5;
  }

  .post-body {
    font-size: 13.5px;
    color: var(--text-2);
    line-height: 1.8;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .post-foot {
    display: flex;
    gap: 20px;
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--text-3);
  }

  .post-foot span { cursor: pointer; }
  .post-foot span:hover { color: var(--text-2); }

  /* 右侧栏 */
  .right {
    position: sticky;
    top: 80px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .panel-title { font-size: 13.5px; font-weight: 600; }
  .panel-more { font-size: 12px; color: var(--text-3); cursor: pointer; }
  .panel-more:hover { color: var(--accent); }

  .topic {
    display: inline-block;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text-2);
    margin: 0 6px 6px 0;
    cursor: pointer;
  }
  .topic:hover { color: var(--accent); }

  .rank-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    font-size: 13px;
  }

  .rank-num {
    width: 16px;
    font-size: 12px;
    color: var(--text-3);
    font-weight: 600;
  }
  .rank-num.top { color: var(--accent); }

  .rank-name { flex: 1; color: var(--text-2); }
  .rank-score { font-size: 12px; color: var(--text-3); }

  .empty {
    text-align: center;
    color: var(--text-3);
    font-size: 13px;
    padding: 40px 0;
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .side, .right { position: static; }
    .side { order: 2; }
    .right { order: 3; }
    .main { order: 1; }
  }
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="logo">
    <div class="logo-icon">🎓</div>
    方城一高 · 校园墙
  </div>
  <div class="search">
    <input placeholder="搜索帖子、同学或话题" />
  </div>
  <div class="top-right">
    <button class="btn btn-primary" onclick="focusComposer()">＋ 发帖</button>
    <button class="btn btn-ghost">登录</button>
  </div>
</div>

<!-- 布局 -->
<div class="layout">

  <!-- 左 -->
  <aside class="side">
    <div class="menu">
      <div class="menu-item active"><span class="menu-icon">🏠</span>首页</div>
      <div class="menu-item"><span class="menu-icon">🧭</span>发现</div>
      <div class="menu-item"><span class="menu-icon">🔔</span>通知</div>
      <div class="menu-item"><span class="menu-icon">👤</span>我的</div>
    </div>
    <button class="publish" onclick="focusComposer()">＋ 发布新帖</button>
    <div class="rules">
      <div class="rules-title">社区公约</div>
      尊重他人隐私，拒绝广告与违法内容。这里是方城一高同学的公共客厅。
    </div>
  </aside>

  <!-- 中 -->
  <main class="main">
    <div class="hero">
      <div class="hero-tag"><span class="dot"></span> 方城一高 · 校园日常</div>
      <h1>欢迎来到 <em>校园墙</em></h1>
      <p>记录在这里的每一天。食堂、操场、晚自习、走廊里的风，还有那些说不出口的话，都可以放这里。</p>
      <div class="stats">
        <div><div class="stat-num" id="statPosts">0</div><div class="stat-label">帖子</div></div>
        <div><div class="stat-num">0</div><div class="stat-label">今日新帖</div></div>
        <div><div class="stat-num">1</div><div class="stat-label">今日在线</div></div>
      </div>
      <div class="hero-actions">
        <button class="btn btn-primary" onclick="focusComposer()">立即加入</button>
        <button class="btn btn-ghost">先逛逛</button>
      </div>
    </div>

    <!-- 发帖框 -->
    <div class="composer" id="composer">
      <textarea id="postInput" placeholder="写点什么…（发帖后只保存在你自己的浏览器里）"></textarea>
      <div class="composer-bar">
        <button class="btn btn-ghost" onclick="closeComposer()">取消</button>
        <button class="btn btn-primary" onclick="publish()">发布</button>
      </div>
    </div>

    <!-- 筛选 -->
    <div class="filters">
      <div class="filter active">最新</div>
      <div class="filter">热门</div>
      <div class="filter">精华</div>
      <div class="refresh" onclick="render()">↻ 刷新</div>
    </div>

    <!-- 帖子列表 -->
    <div id="postList"></div>
  </main>

  <!-- 右 -->
  <aside class="right">
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">热门话题</div>
        <div class="panel-more">全部</div>
      </div>
      <div>
        <span class="topic"># 晚自习日常</span>
        <span class="topic"># 食堂测评</span>
        <span class="topic"># 操场夜跑</span>
        <span class="topic"># 失物招领</span>
        <span class="topic"># 毕业留言</span>
        <span class="topic"># 校园风景</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">积分榜</div>
        <div class="panel-more">🏆</div>
      </div>
      <div class="rank-item"><span class="rank-num top">1</span><span class="rank-name">校园墙管理员</span><span class="rank-score">22</span></div>
      <div class="rank-item"><span class="rank-num top">2</span><span class="rank-name">我带飞</span><span class="rank-score">14</span></div>
      <div class="rank-item"><span class="rank-num top">3</span><span class="rank-name">7891</span><span class="rank-score">4</span></div>
      <div class="rank-item"><span class="rank-num">4</span><span class="rank-name">我怎么你了</span><span class="rank-score">3</span></div>
      <div class="rank-item"><span class="rank-num">5</span><span class="rank-name">蛋的父亲</span><span class="rank-score">1</span></div>
      <div class="rank-item"><span class="rank-num">6</span><span class="rank-name">老胡</span><span class="rank-score">0</span></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">社区数据</div>
      </div>
      <div class="stats" style="margin-bottom:0">
        <div><div class="stat-num" id="statPosts2">0</div><div class="stat-label">帖子</div></div>
        <div><div class="stat-num">0</div><div class="stat-label">评论</div></div>
      </div>
    </div>
  </aside>

</div>

<script>
  const KEY = 'fcxg_posts_v1';

  const defaultPosts = [
    {
      id: 1,
      user: '校园墙管理员',
      avatar: '🎓',
      time: '08-28 16:14 · 校园日常',
      title: '【必读】校园墙社区公约',
      body: '欢迎来到方城一高校园墙。\n\n为了让这里保持友善、真实、有用，请大家共同遵守：\n1. 不发布攻击、辱骂、泄露隐私的内容；\n2. 不刷屏、不发广告；\n3. 理性讨论，好好说话。\n\n这里是我们共同的公共客厅，请温柔一点。',
      pinned: true,
      likes: 14,
      comments: 3
    },
    {
      id: 2,
      user: '老胡',
      avatar: '🌙',
      time: '10-03 21:40 · 校园日常',
      title: '晚自习下课那阵风',
      body: '每次走出教学楼，风一吹，整个人才活过来。\n不知道以后离开这里，还会不会记得这种感觉。',
      pinned: false,
      likes: 26,
      comments: 5
    },
    {
      id: 3,
      user: '7891',
      avatar: '🍜',
      time: '10-04 12:03 · 食堂测评',
      title: '食堂二楼那个窗口',
      body: '今天去晚了，只剩最后一份。\n吃的时候还挺香的。',
      pinned: false,
      likes: 11,
      comments: 2
    }
  ];

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return defaultPosts.slice();
      const arr = JSON.parse(raw);
      return Array.isArray(arr) && arr.length ? arr : defaultPosts.slice();
    } catch (e) {
      return defaultPosts.slice();
    }
  }

  function save(posts) {
    try { localStorage.setItem(KEY, JSON.stringify(posts)); } catch (e) {}
  }

  let posts = load();

  function render() {
    posts = load();
    const list = document.getElementById('postList');
    list.innerHTML = '';

    if (!posts.length) {
      list.innerHTML = '<div class="empty">还没有帖子，来发第一条吧。</div>';
    } else {
      posts.forEach(p => {
        const el = document.createElement('div');
        el.className = 'post';
        el.innerHTML = `
          <div class="post-head">
            <div class="avatar">${p.avatar || '👤'}</div>
            <div>
              <div class="post-user">${esc(p.user)}</div>
              <div class="post-meta">${esc(p.time)}</div>
            </div>
            ${p.pinned ? '<div class="pin">置顶</div>' : ''}
          </div>
          <div class="post-title">${esc(p.title || '')}</div>
          <div class="post-body">${esc(p.body || '')}</div>
          <div class="post-foot">
            <span>👍 ${p.likes || 0}</span>
            <span>💬 ${p.comments || 0}</span>
            <span>↗ 分享</span>
          </div>
        `;
        list.appendChild(el);
      });
    }

    document.getElementById('statPosts').textContent = posts.length;
    document.getElementById('statPosts2').textContent = posts.length;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function focusComposer() {
    const c = document.getElementById('composer');
    c.classList.add('show');
    document.getElementById('postInput').focus();
    c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function closeComposer() {
    document.getElementById('composer').classList.remove('show');
    document.getElementById('postInput').value = '';
  }

  function publish() {
    const val = document.getElementById('postInput').value.trim();
    if (!val) {
      alert('写点什么再发吧');
      return;
    }

    const lines = val.split('\n');
    const title = lines[0].slice(0, 30);
    const body = lines.slice(1).join('\n') || '';

    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const time =
      pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' +
      pad(now.getHours()) + ':' + pad(now.getMinutes()) +
      ' · 校园日常';

    posts.unshift({
      id: Date.now(),
      user: '我',
      avatar: '🙂',
      time: time,
      title: title,
      body: body,
      pinned: false,
      likes: 0,
      comments: 0
    });

    save(posts);
    closeComposer();
    render();
  }

  // 筛选切换（纯视觉）
  document.querySelectorAll('.filter').forEach(f => {
    f.addEventListener('click', () => {
      document.querySelectorAll('.filter').forEach(x => x.classList.remove('active'));
      f.classList.add('active');
    });
  });

  render();
</script>

</body>
</html>
